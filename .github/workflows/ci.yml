name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test (unit + integration, Testcontainers Postgres)
        run: ./gradlew :backend:test --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: backend/build/reports/tests/

  docker:
    runs-on: ubuntu-latest
    needs: test
    env:
      # Throwaway values for the CI stack only.
      DB_PASSWORD: ci-db-password
      TRACKER_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v7

      # Build through compose so the image name always matches docker-compose.yml.
      - name: Build image
        run: docker compose build app

      - name: docker compose up and wait for healthy app
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || true)
            echo "app health: $status"
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          [ "$status" = "healthy" ] || { docker compose logs app; exit 1; }
          curl -fsS http://localhost:8080/actuator/health
          tables=$(docker compose exec -T db psql -U tracker -d llmtracker -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name <> 'flyway_schema_history'")
          echo "tables: $tables"
          [ "$tables" = "7" ]

      - name: Create a project with the CLI and use its key
        run: |
          out=$(docker compose run --rm -T app --create-project=ci-smoke)
          key=$(echo "$out" | grep -E '^trk_[0-9A-Za-z]+$')
          [ -n "$key" ] || { echo "$out"; exit 1; }
          echo "created project; key ends ...${key: -4}"
          stored=$(docker compose exec -T db psql -U tracker -d llmtracker -tAc \
            "SELECT key_last4 FROM project WHERE name = 'ci-smoke'")
          [ "$stored" = "${key: -4}" ]
          # Missing key is rejected before anything is forwarded.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/proxy/openai/chat/completions)
          echo "no key -> $code"; [ "$code" = "401" ]

      - name: Tear down
        if: always()
        run: docker compose down -v
