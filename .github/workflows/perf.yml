name: Dashboard performance check (manual)

# Seeds one million demo events into Postgres 16 and times the dashboard API (SPEC.md: the load check is a
# documented manual step, not part of CI). Run it from the Actions tab or with: gh workflow run perf.yml
on:
  workflow_dispatch:
    inputs:
      events:
        description: Number of demo events to seed
        default: "1000000"
        required: true

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Seed and time the dashboard API
        env:
          EVENTS: ${{ inputs.events }}
        run: ./gradlew :backend:perfTest -Dperf.events="$EVENTS" --console=plain

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: backend/build/test-results/perfTest/
