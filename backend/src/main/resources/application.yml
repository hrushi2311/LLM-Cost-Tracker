spring:
  application:
    name: llm-cost-tracker
  main:
    banner-mode: off
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/llmtracker}
    username: ${SPRING_DATASOURCE_USERNAME:tracker}
    # password has no default: SPRING_DATASOURCE_PASSWORD is required
    hikari:
      # Fail fast when Postgres is down; the batch writer drops and counts the batch instead of stalling.
      connection-timeout: 5000
      # Dashboard ranges vary from an hour to months, so let Postgres plan each query for its actual values
      # instead of switching to one generic plan after five executions (seen: 0.43 s -> 1.4 s at 1M events).
      connection-init-sql: SET plan_cache_mode = force_custom_plan
  jackson:
    deserialization:
      # Dashboard API: reject unknown fields in request bodies (SPEC.md, Dashboard REST API).
      fail-on-unknown-properties: true
  codec:
    # Never log request/response details (headers, bodies), even at DEBUG.
    log-request-details: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

tracker:
  # Bound from TRACKER_ADMIN_PASSWORD; required, min 12 characters.
  admin-password: ${TRACKER_ADMIN_PASSWORD:}
  # Everything else binds straight from TRACKER_* variables with the defaults in TrackerProperties, e.g.
  # TRACKER_REQUIRE_PROJECT_KEY, TRACKER_OPENAI_BASE_URL, TRACKER_UPSTREAM_TIMEOUT, TRACKER_QUEUE_CAPACITY.
