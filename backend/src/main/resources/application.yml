spring:
  application:
    name: llm-cost-tracker
  main:
    banner-mode: off
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/llmtracker}
    username: ${SPRING_DATASOURCE_USERNAME:tracker}
    # password has no default: SPRING_DATASOURCE_PASSWORD is required
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

tracker:
  # Bound from TRACKER_ADMIN_PASSWORD; required, min 12 characters.
  admin-password: ${TRACKER_ADMIN_PASSWORD:}
