services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: llmtracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d llmtracker"]
      interval: 5s
      retries: 10

  app:
    # Local tag until the release milestone publishes ghcr.io/<owner>/llm-cost-tracker (see docs/DECISIONS.md).
    image: llm-cost-tracker:latest
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/llmtracker
      SPRING_DATASOURCE_USERNAME: tracker
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      TRACKER_ADMIN_PASSWORD: ${TRACKER_ADMIN_PASSWORD:?set TRACKER_ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
